<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="theme-color" content="#007AFF">
    <title>Sei offline — RENTRI Operatore</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --blue: #007AFF;
            --text: #1c1c1e;
            --secondary: #636366;
            --bg: #F2F2F7;
            --card: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text: #f2f2f7;
                --secondary: #aeaeb2;
                --bg: #1c1c1e;
                --card: #2c2c2e;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        main {
            text-align: center;
            max-width: 340px;
            width: 100%;
        }

        .icon {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            background: var(--blue);
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon svg {
            width: 36px;
            height: 36px;
            stroke: #fff;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.4px;
            margin-bottom: 10px;
        }

        p {
            font-size: 15px;
            line-height: 1.55;
            color: var(--secondary);
            margin-bottom: 28px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--blue);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            transition: opacity .15s;
        }

        .btn:active { opacity: .8; }

        .status {
            margin-top: 20px;
            font-size: 12px;
            color: var(--secondary);
            opacity: 0;
            transition: opacity .3s;
        }

        .status.visible { opacity: 1; }
    </style>
</head>
<body>
    <main>
        <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"/>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
                <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                <line x1="12" y1="20" x2="12.01" y2="20"/>
            </svg>
        </div>

        <h1>Sei offline</h1>
        <p>L'app Operatore richiede connessione per bonifica, smontaggio e ricambi.<br>Riprova quando la rete è disponibile.</p>

        <button class="btn" onclick="tryReconnect(this)" aria-label="Riprova connessione">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="1 4 1 10 7 10"/>
                <path d="M3.51 15a9 9 0 1 0 .49-3.44"/>
            </svg>
            Riprova
        </button>

        <p class="status" id="status" aria-live="polite"></p>
    </main>

    <script>
        function tryReconnect(btn) {
            var status = document.getElementById('status');
            btn.disabled = true;
            status.textContent = 'Verifica connessione…';
            status.classList.add('visible');

            fetch('/operatore', { method: 'HEAD', cache: 'no-store' })
                .then(function (r) {
                    if (r.ok) {
                        status.textContent = 'Connessione ripristinata, reindirizzo…';
                        window.location.href = '/operatore';
                    } else {
                        throw new Error('non ok');
                    }
                })
                .catch(function () {
                    status.textContent = 'Ancora offline. Riprova tra qualche secondo.';
                    btn.disabled = false;
                    setTimeout(function () { status.classList.remove('visible'); }, 3000);
                });
        }

        // Auto-retry when connection comes back
        window.addEventListener('online', function () {
            window.location.href = '/operatore';
        });
    </script>
</body>
</html>
