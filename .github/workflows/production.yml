name: Production CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-preflight:
    name: PHPUnit + preflight produzione
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rentri_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: production
      APP_DEBUG: false
      APP_DEMO_MODE: false
      ALLOW_SESSION_DEMO: true
      RENTRI_API_STUB: true
      RENTRI_FIRMA_STUB: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, sqlite, pgsql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Configure production environment
        run: |
          cp .env.production.example .env
          php artisan key:generate --ansi
          {
            echo "DB_CONNECTION=pgsql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=5432"
            echo "DB_DATABASE=rentri_crm"
            echo "DB_USERNAME=postgres"
            echo "DB_PASSWORD=postgres"
            echo "SESSION_DRIVER=file"
            echo "CACHE_STORE=file"
            echo "QUEUE_CONNECTION=sync"
            echo "ALLOW_SESSION_DEMO=true"
            echo "RENTRI_API_STUB=true"
            echo "RENTRI_FIRMA_STUB=true"
          } >> .env

      - name: Build frontend assets
        run: npm run build

      - name: Prepare database
        run: |
          php artisan migrate --force --ansi
          php artisan db:seed --force --ansi

      - name: Production preflight (no deploy secrets)
        run: php artisan rentri:preflight --ansi

      - name: Run PHPUnit suite
        run: php artisan test --ansi

  playwright-palestra-smoke:
    name: Playwright palestra smoke
    runs-on: ubuntu-latest
    needs: test-and-preflight

    env:
      ALLOW_SESSION_DEMO: true
      E2E_PORT: '8765'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci
          npx playwright install --with-deps chromium

      - name: Configure E2E environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          echo "ALLOW_SESSION_DEMO=true" >> .env

      - name: Build frontend assets
        run: npm run build

      - name: Run Playwright palestra smoke
        run: npm run test:e2e
